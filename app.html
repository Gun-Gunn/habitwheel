<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Habit Wheel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFF9F0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app{padding:1rem;max-width:680px;margin:0 auto;background:#FFF9F0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem;gap:8px;flex-wrap:wrap}
.title{font-size:22px;font-weight:500;color:#FF3B30}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.month-nav{display:flex;align-items:center;gap:6px}
.nav-btn{background:#fff;border:2px solid #FFD6C8;border-radius:8px;padding:4px 10px;cursor:pointer;color:#FF3B30;font-size:13px;transition:all 0.2s}
.nav-btn:hover{background:#FFF0EB;border-color:#FF9500}
.month-display{font-size:14px;font-weight:500;color:#FF3B30;min-width:130px;text-align:center}
.year-sel{padding:5px 8px;border:2px solid #FFD6C8;border-radius:8px;background:#fff;color:#333;font-size:13px;cursor:pointer}
.year-sel:focus{outline:none;border-color:#FF6B35}
.logout-btn{padding:5px 12px;border:2px solid #FFD6C8;border-radius:8px;background:#fff;color:#FF3B30;cursor:pointer;font-size:12px;transition:all 0.2s}
.logout-btn:hover{background:#FFEAEA}
.greeting{font-size:13px;color:#FF6B35;font-weight:500;margin-bottom:1rem}
.habits-section{background:#fff;border:2px solid #FFE0CC;border-radius:14px;padding:1rem;margin-bottom:1rem}
.habits-section-title{font-size:11px;color:#999;margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.5px}
.habit-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;border-radius:10px;padding:2px;transition:background 0.3s}
.habit-row.today-done{border-radius:10px}
.habit-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.habit-input{flex:1;border:2px solid #FFD6C8;border-radius:8px;padding:5px 10px;font-size:13px;color:#333;background:#FFF9F0}
.habit-input:focus{outline:none;border-color:#FF6B35}
.del-habit-btn{background:none;border:2px solid #FFD6C8;border-radius:8px;width:30px;height:30px;cursor:pointer;color:#FF3B30;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
.del-habit-btn:hover{background:#FFEAEA;border-color:#FF3B30}
.add-habit-row{display:flex;gap:8px;margin-top:8px}
.add-habit-input{flex:1;border:2px dashed #FFD6C8;border-radius:8px;padding:5px 10px;font-size:13px;color:#333;background:#fff}
.add-habit-input:focus{outline:none;border-color:#FF9500}
.add-habit-btn{padding:5px 14px;border:none;border-radius:8px;background:#FF3B30;color:#fff;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:background 0.2s}
.add-habit-btn:hover{background:#E02020}
.max-note{font-size:11px;color:#bbb;margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#222;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all 0.3s;z-index:1100;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:#2e7d32}
.toast.error{background:#c62828}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0.5rem;justify-content:center}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#555;cursor:pointer;padding:3px 8px;border-radius:6px;transition:background 0.2s;border:1.5px solid transparent}
.legend-item:hover{background:#FFE0CC;border-color:#FFD6C8}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-hint{font-size:10px;color:#ccc;width:100%;text-align:center;margin-top:2px}
.emoji-btn{background:#FFF9F0;border:2px solid #FFD6C8;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
.emoji-btn:hover{background:#FFE0CC;border-color:#FF9500}
.today-toggle{border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;background:#f0f0f0;color:#ccc}
.today-toggle.done{color:#fff;font-size:13px}
.today-toggle:hover{opacity:0.85}
.habit-input-wrap{flex:1;position:relative;display:flex;align-items:center}
.habit-input-wrap .habit-input{flex:1;transition:background 0.3s,border 0.3s}
/* Emoji picker popup */
.emoji-picker{position:fixed;z-index:2000;background:#fff;border:2px solid #FFE0CC;border-radius:14px;padding:10px;box-shadow:0 8px 32px rgba(0,0,0,0.15);display:none;flex-direction:column;gap:6px;width:260px}
.emoji-picker.open{display:flex}
.emoji-option{font-size:20px;cursor:pointer;padding:3px;border-radius:6px;transition:background 0.15s;line-height:1;text-align:center}
.emoji-option:hover{background:#FFF0E8}
.wheel-wrap{display:flex;justify-content:center;margin:0.5rem 0}
.stats-row{display:grid;gap:8px;margin-top:1rem}
.stat-card{background:#fff;border:2px solid #FFE0CC;border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:border 0.2s}
.stat-card:hover{border-color:#FF9500}
.stat-pct{font-size:16px;font-weight:500}
.stat-name{font-size:10px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-note{text-align:center;font-size:11px;color:#bbb;margin-bottom:0.5rem}
.loading{text-align:center;padding:3rem;color:#bbb;font-size:14px}

/* NOTE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:1.5rem;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(255,59,48,0.15)}
.modal-header{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.modal-color-bar{width:4px;height:36px;border-radius:4px;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600;color:#333;flex:1}
.modal-date{font-size:11px;color:#bbb}
.modal-status{font-size:11px;padding:3px 8px;border-radius:20px;margin-bottom:10px;display:inline-block}
.status-done{background:#E8F5E9;color:#2e7d32}
.status-undone{background:#FFF3E0;color:#E65100}
.modal-textarea{width:100%;height:80px;border:2px solid #FFD6C8;border-radius:10px;padding:10px;font-size:13px;color:#333;resize:none;background:#FFF9F0;font-family:inherit}
.modal-textarea:focus{outline:none;border-color:#FF6B35}
.modal-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.modal-cancel{padding:8px 14px;border:2px solid #FFD6C8;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-size:12px}
.modal-undo{padding:8px 14px;border:2px solid #FFD6C8;border-radius:8px;background:#fff;color:#FF5722;cursor:pointer;font-size:12px;display:none}
.modal-save{padding:8px 20px;border:none;border-radius:8px;background:#FF3B30;color:#fff;cursor:pointer;font-size:13px;font-weight:500;margin-left:auto}
.modal-save:hover{background:#E02020}

/* LOGS MODAL */
.logs-modal{background:#fff;border-radius:18px;padding:1.5rem;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-height:82vh;display:flex;flex-direction:column}
.logs-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-shrink:0}
.logs-color-bar{width:4px;height:32px;border-radius:4px;flex-shrink:0}
.logs-title{font-size:15px;font-weight:600;color:#333;flex:1}
.logs-close{background:none;border:2px solid #FFD6C8;border-radius:8px;width:30px;height:30px;cursor:pointer;color:#FF3B30;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logs-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-shrink:0;overflow-x:auto;padding-bottom:4px}
.logs-tab{padding:5px 12px;border:2px solid #FFD6C8;border-radius:8px;background:#fff;color:#999;cursor:pointer;font-size:12px;transition:all 0.2s;white-space:nowrap;flex-shrink:0}
.logs-tab.active{background:#FF3B30;color:#fff;border-color:#FF3B30}
.logs-body{overflow-y:auto;flex:1}
.log-entry{display:flex;align-items:flex-start;gap:10px;padding:10px 6px;border-bottom:1px solid #FFF0E8;position:relative}
.log-entry:last-child{border-bottom:none}
.log-day-badge{background:#FFF0E8;color:#FF3B30;font-size:14px;font-weight:700;border-radius:8px;padding:4px 8px;min-width:36px;text-align:center;flex-shrink:0;line-height:1.3}
.log-note-text{font-size:13px;color:#444;line-height:1.5;flex:1;padding-top:2px}
.log-no-note{font-size:12px;color:#ccc;font-style:italic;flex:1;padding-top:4px}
.log-edit-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:13px;padding:2px 6px;border-radius:6px;transition:all 0.2s;flex-shrink:0}
.log-edit-btn:hover{background:#FFF0E8;color:#FF6B35}
.month-section-label{font-size:11px;color:#bbb;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:10px 6px 4px;border-bottom:1px solid #FFF0E8}
.empty-logs{text-align:center;padding:2rem;color:#bbb;font-size:13px}
.view-all-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:1rem;padding:10px;border:2px solid #FFD6C8;border-radius:10px;background:#fff;color:#FF3B30;cursor:pointer;font-size:13px;font-weight:500;width:100%;transition:all 0.2s;flex-shrink:0}
.view-all-btn:hover{background:#FFF0EB}
/* Archive */
.archive-btn{background:none;border:2px solid #FFD6C8;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;color:#999}
.archive-btn:hover{background:#FFF3E0;border-color:#FF9500;color:#FF9500}
.archived-section{background:#fff;border:2px dashed #FFE0CC;border-radius:14px;padding:1rem;margin-bottom:1rem}
.archived-section-title{font-size:11px;color:#bbb;margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.archived-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;opacity:0.7}
.archived-name{flex:1;font-size:13px;color:#999;padding:5px 10px}
.archived-date{font-size:10px;color:#ccc;white-space:nowrap}
.restore-btn{padding:4px 10px;border:2px solid #FFD6C8;border-radius:8px;background:#fff;color:#4CAF50;cursor:pointer;font-size:11px;font-weight:500;white-space:nowrap;transition:all 0.2s}
.restore-btn:hover{background:#E8F5E9;border-color:#4CAF50}
.perm-delete-btn{background:none;border:2px solid #FFD6C8;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#ccc;transition:all 0.2s}
.perm-delete-btn:hover{background:#FFEAEA;border-color:#FF3B30;color:#FF3B30}
/* Delete confirm modal */
.del-modal{background:#fff;border-radius:18px;padding:1.5rem;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.del-modal-title{font-size:15px;font-weight:600;color:#333;margin-bottom:8px}
.del-modal-desc{font-size:13px;color:#666;line-height:1.5;margin-bottom:1.2rem}
.del-modal-btns{display:flex;gap:8px;justify-content:flex-end}
.del-archive-btn{padding:8px 16px;border:none;border-radius:8px;background:#FF9500;color:#fff;cursor:pointer;font-size:13px;font-weight:500}
.del-archive-btn:hover{background:#E08000}
.del-confirm-btn{padding:8px 16px;border:none;border-radius:8px;background:#FF3B30;color:#fff;cursor:pointer;font-size:13px;font-weight:500}
.del-confirm-btn:hover{background:#E02020}
.del-cancel-btn{padding:8px 14px;border:2px solid #FFD6C8;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-size:13px}
</style>
</head>
<body>

<div class="emoji-picker" id="emojiPicker"></div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delModal">
  <div class="del-modal">
    <div class="del-modal-title">🗑 Habit hatao</div>
    <div class="del-modal-desc" id="delModalDesc"></div>
    <div class="del-modal-btns">
      <button class="del-cancel-btn" onclick="closeDelModal()">Cancel</button>
      <button class="del-archive-btn" onclick="confirmArchive()">📦 Archive karo</button>
      <button class="del-confirm-btn" onclick="confirmDelete()">🗑 Delete karo</button>
    </div>
  </div>
</div>

<!-- Note Modal -->
<div class="modal-overlay" id="noteModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-color-bar" id="noteDot"></div>
      <div>
        <div class="modal-title" id="noteTitle"></div>
        <div class="modal-date" id="noteDate"></div>
      </div>
    </div>
    <div id="noteStatusBadge" class="modal-status"></div>
    <textarea class="modal-textarea" id="noteInput" placeholder="Kya kiya aaj? (optional)"></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeNoteModal()">Cancel</button>
      <button class="modal-undo" id="undoBtn" onclick="undoCell()">✕ Mark Undone</button>
      <button class="modal-save" id="noteSaveBtn" onclick="saveNote()">✓ Mark Done</button>
    </div>
  </div>
</div>

<!-- Logs Modal -->
<div class="modal-overlay" id="logsModal">
  <div class="logs-modal">
    <div class="logs-header">
      <div class="logs-color-bar" id="logsColorBar"></div>
      <div class="logs-title" id="logsTitle"></div>
      <button class="logs-close" onclick="closeLogsModal()">✕</button>
    </div>
    <div class="logs-tabs" id="logsTabs"></div>
    <div class="logs-body" id="logsBody"></div>
    <button class="view-all-btn" id="viewAllBtn" onclick="showAllLogs()">📋 View All Months</button>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">
  <div class="top">
    <div>
      <div class="title">🌀 Habit Wheel</div>
      <div class="greeting" id="greetingText"></div>
    </div>
    <div class="top-right">
      <select class="year-sel" id="yearSel"></select>
      <div class="month-nav">
        <button class="nav-btn" id="prevMonth">&#8249;</button>
        <div class="month-display" id="monthDisplay"></div>
        <button class="nav-btn" id="nextMonth">&#8250;</button>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="habits-section">
    <div class="habits-section-title">Your habits</div>
    <div id="habitsRow"></div>
    <div class="add-habit-row" id="addRow">
      <input class="add-habit-input" id="newHabitInput" placeholder="New habit name..." maxlength="30"/>
      <button class="add-habit-btn" id="addHabitBtn">+ Add</button>
    </div>
    <div class="max-note" id="maxNote"></div>
  </div>

  <!-- Archived habits -->
  <div class="archived-section" id="archivedSection" style="display:none">
    <div class="archived-section-title" onclick="toggleArchivedView()">
      <span>📦 Archived Habits</span>
      <span id="archivedToggleIcon">▼</span>
    </div>
    <div id="archivedList" style="display:none"></div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="info-note" id="infoNote"></div>
  <div class="wheel-wrap">
    <svg id="wheel" width="560" height="560" viewBox="0 0 560 560" style="max-width:100%;height:auto"></svg>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <div style="text-align:center;padding:1.5rem 0 0.5rem;font-size:12px;color:#bbb">
    Need help? <a href="mailto:gungunsindhwani5@gmail.com" style="color:#FF6B35;text-decoration:none;font-weight:500">gungunsindhwani5@gmail.com</a>
  </div>
</div>

<div class="loading" id="loadingScreen">Loading...</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://ogigpzekqgdgtldcfyjz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9naWdwemVrcWdkZ3RsZGNmeWp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTI4MTksImV4cCI6MjA5NDY2ODgxOX0.3_Jx9NbZWUhWguljC74jzfSuQIrI_-NM_Dphcc0AGk0';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const ALL_COLORS=['#4CAF50','#FF9800','#2196F3','#E91E63','#9C27B0','#00BCD4','#FF5722','#8BC34A'];
const ALL_LIGHT= ['#C8E6C9','#FFE0B2','#BBDEFB','#FCE4EC','#E1BEE7','#B2EBF2','#FFCCBC','#DCEDC8'];
const MAX_HABITS=15;
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

let state={habits:['Morning walk','Study 1hr','No junk food','Read 30min'],emojis:['🚶','📚','🥗','📖'],data:{},notes:{},archived:[],year:2026,month:5};
let currentUser=null;
let saveTimer=null, toastTimer=null;
let pendingDay=null, pendingHi=null;
let logsHabitIndex=null;

// ── AUTH ──
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return;}
  const {data:profile}=await sb.from('profiles').select('role,name').eq('id',session.user.id).single();
  if(!profile||profile.role==='pending'){await sb.auth.signOut();window.location.href='index.html';return;}
  currentUser=session.user;
  const displayName=profile.name||session.user.email.split('@')[0];
  document.getElementById('greetingText').textContent='Hello, '+displayName+' 👋';
  await loadData();
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  initControls();render();
}
async function logout(){await sb.auth.signOut();window.location.href='index.html';}

// ── DATA ──
async function loadData(){
  const now=new Date();state.year=now.getFullYear();state.month=now.getMonth()+1;
  const {data}=await sb.from('habit_data').select('habits,data,notes,emojis,archived').eq('user_id',currentUser.id).single();
  if(data){
    if(data.habits&&data.habits.length>0)state.habits=data.habits;
    if(data.data)state.data=data.data;
    if(data.notes)state.notes=data.notes;
    if(data.emojis)state.emojis=data.emojis;
    if(data.archived)state.archived=data.archived;
  }
}

async function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const {data:existing}=await sb.from('habit_data').select('id').eq('user_id',currentUser.id).single();
    let error;
    if(existing){
      ({error}=await sb.from('habit_data').update({habits:state.habits,data:state.data,notes:state.notes,emojis:state.emojis,archived:state.archived,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id));
    } else {
      ({error}=await sb.from('habit_data').insert({user_id:currentUser.id,habits:state.habits,data:state.data,notes:state.notes,emojis:state.emojis,archived:state.archived,updated_at:new Date().toISOString()}));
    }
    if(error)showToast('Save failed!','error');
    else showToast('✓ Saved','success');
  },800);
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',2000);
}

// ── CONTROLS ──
function initControls(){
  const yearSel=document.getElementById('yearSel');yearSel.innerHTML='';
  for(let y=2024;y<=2030;y++){const o=document.createElement('option');o.value=y;o.textContent=y;if(y===state.year)o.selected=true;yearSel.appendChild(o);}
  yearSel.onchange=()=>{state.year=parseInt(yearSel.value);render();};
  document.getElementById('prevMonth').onclick=()=>{state.month--;if(state.month<1){state.month=12;state.year--;document.getElementById('yearSel').value=state.year;}render();};
  document.getElementById('nextMonth').onclick=()=>{state.month++;if(state.month>12){state.month=1;state.year++;document.getElementById('yearSel').value=state.year;}render();};
}

// ── HELPERS ──
function getDays(y,m){return new Date(y||state.year,(m||state.month),0).getDate();}
function cellKey(d,hi,y,m){return`${y||state.year}-${String(m||state.month).padStart(2,'0')}:${d}:${hi}`;}
function noteKey(d,hi,y,m){return`note:${y||state.year}-${String(m||state.month).padStart(2,'0')}:${d}:${hi}`;}
function isFuture(day){const now=new Date();now.setHours(0,0,0,0);return new Date(state.year,state.month-1,day)>now;}
function isToday(day){const now=new Date();return state.year===now.getFullYear()&&state.month===(now.getMonth()+1)&&day===now.getDate();}

// ── NOTE MODAL ──
function openNoteModal(day,hi){
  if(isFuture(day))return;
  pendingDay=day;pendingHi=hi;
  const done=!!state.data[cellKey(day,hi)];
  const existingNote=state.notes[noteKey(day,hi)]||'';
  document.getElementById('noteDot').style.background=ALL_COLORS[hi];
  document.getElementById('noteTitle').textContent=state.habits[hi]||'Habit '+(hi+1);

function renderLogsTabs(){

function showAllLogs(){
  document.getElementById('viewAllBtn').style.display='none';
  document.querySelectorAll('.logs-tab').forEach(b=>b.classList.remove('active'));
  // Collect unique months that have data for this habit
  const monthSet=new Set();
  Object.keys(state.data).forEach(k=>{
    const parts=k.split(':');
    if(parts.length===3&&parseInt(parts[2])===logsHabitIndex){
      monthSet.add(parts[0]); // "YYYY-MM"
    }
  });
  const months=[...monthSet].sort().reverse();
  if(!months.length){document.getElementById('logsBody').innerHTML='<div class="empty-logs">Koi logs nahi hain abhi 🌱</div>';return;}
  let html='';
  months.forEach(mk=>{
    const [y,m]=mk.split('-').map(Number);
    const entries=getLogsForMonth(y,m);
    if(entries){
      html+=`<div class="month-section-label">${MONTH_NAMES[m-1]} ${y}</div>`;
      html+=entries;
    }
  });
  document.getElementById('logsBody').innerHTML=html||'<div class="empty-logs">Koi logs nahi hain abhi 🌱</div>';
}

function renderLogsBody(y,m){
  const html=getLogsForMonth(y,m);
  document.getElementById('logsBody').innerHTML=html||'<div class="empty-logs">Is mahine koi entry nahi 🌱</div>';
}

function getLogsForMonth(y,m){
  const days=getDays(y,m);
  let html='';
  for(let d=1;d<=days;d++){
    const ck=cellKey(d,logsHabitIndex,y,m);
    if(state.data[ck]){
      const nk=noteKey(d,logsHabitIndex,y,m);
      const note=state.notes[nk]||'';
      html+=`<div class="log-entry">
        <div class="log-day-badge">${d}</div>
        ${note
          ?`<div class="log-note-text">${note}</div>`
          :`<div class="log-no-note">No note</div>`
        }
        <button class="log-edit-btn" onclick="editLog(${d},${logsHabitIndex},${y},${m})" title="Edit note">✏️</button>
      </div>`;
    }
  }
  return html;
}

function editLog(day,hi,y,m){
  // Close logs modal, open note modal for that specific day
  closeLogsModal();
  // Temporarily set state to that month/year for the modal
  const origYear=state.year, origMonth=state.month;
  state.year=y;state.month=m;
  pendingDay=day;pendingHi=hi;
  const done=!!state.data[cellKey(day,hi,y,m)];
  const existingNote=state.notes[noteKey(day,hi,y,m)]||'';
  document.getElementById('noteDot').style.background=ALL_COLORS[hi];
  document.getElementById('noteTitle').textContent=state.habits[hi]||'Habit '+(hi+1);
  document.getElementById('noteDate').textContent=MONTH_NAMES[m-1]+' '+day+', '+y;
  document.getElementById('noteInput').value=existingNote;
  document.getElementById('noteInput').placeholder='Edit your note...';
  const badge=document.getElementById('noteStatusBadge');
  badge.textContent='✅ Done';badge.className='modal-status status-done';
  document.getElementById('undoBtn').style.display='block';
  document.getElementById('noteSaveBtn').textContent='💾 Update Note';
  document.getElementById('noteModal').classList.add('open');
  // Restore state year/month after modal closes
  const origClose=closeNoteModal;
  window._editLogClose=function(){
    state.year=origYear;state.month=origMonth;
    document.getElementById('noteModal').classList.remove('open');
    pendingDay=null;pendingHi=null;
    // reopen logs
    setTimeout(()=>openLogsModal(hi),100);
  };
  document.getElementById('noteModal').onclick=function(e){if(e.target===this)window._editLogClose();};
  document.querySelector('.modal-cancel').onclick=window._editLogClose;
  setTimeout(()=>document.getElementById('noteInput').focus(),100);
}

function confirmArchive(){
  const i=pendingDeleteIndex;
  if(i===null)return;
  // Save to archived array with all data
  const habitData={},habitNotes={};
  Object.keys(state.data).forEach(k=>{
    const parts=k.split(':');
    if(parts.length===3&&parseInt(parts[2])===i){
      habitData[`${parts[0]}:${parts[1]}`]=state.data[k];
    }
  });
  Object.keys(state.notes).forEach(k=>{
    const parts=k.split(':');
    if(parts.length===4&&parseInt(parts[3])===i){
      habitNotes[`${parts[0]}:${parts[1]}:${parts[2]}`]=state.notes[k];
    }
  });
  state.archived.push({
    name:state.habits[i],
    emoji:state.emojis[i]||'⭐',
    archivedAt:new Date().toISOString().slice(0,10),
    data:habitData,
    notes:habitNotes
  });
  // Now remove from active (reindex)
  _removeHabitAt(i);
  closeDelModal();
  showToast('📦 Archived! Restore kar sako kabhi bhi.','success');
}

function confirmDelete(){
  const i=pendingDeleteIndex;
  if(i===null)return;
  _removeHabitAt(i);
  closeDelModal();
  showToast('Deleted ✓','success');
}

function _removeHabitAt(i){
  // Delete data+notes for habit i
  Object.keys(state.data).forEach(k=>{
    const parts=k.split(':');
    if(parts.length===3&&parseInt(parts[2])===i)delete state.data[k];
  });
  Object.keys(state.notes).forEach(k=>{
    const parts=k.split(':');
    if(parts.length===4&&parseInt(parts[3])===i)delete state.notes[k];
  });
  // Reindex
  const newData={},newNotes={};
  Object.keys(state.data).forEach(k=>{
    const parts=k.split(':');
    if(parts.length===3){
      const hi=parseInt(parts[2]);
      if(hi>i)newData[`${parts[0]}:${parts[1]}:${hi-1}`]=state.data[k];
      else newData[k]=state.data[k];
    }
  });
  Object.keys(state.notes).forEach(k=>{
    const parts=k.split(':');
    if(parts.length===4){
      const hi=parseInt(parts[3]);
      if(hi>i)newNotes[`${parts[0]}:${parts[1]}:${parts[2]}:${hi-1}`]=state.notes[k];
      else newNotes[k]=state.notes[k];
    }
  });
  state.data=newData;
  state.notes=newNotes;
  state.habits.splice(i,1);
  state.emojis.splice(i,1);
  save();render();
}

function restoreHabit(ai){
  if(state.habits.length>=MAX_HABITS){showToast('Max 8 habits! Pehle koi delete karo.','error');return;}
  const archived=state.archived[ai];
  const newIdx=state.habits.length;
  state.habits.push(archived.name);
  state.emojis.push(archived.emoji);
  // Restore data with new index
  Object.keys(archived.data).forEach(k=>{
    state.data[`${k}:${newIdx}`]=archived.data[k];
  });
  Object.keys(archived.notes).forEach(k=>{
    state.notes[`note:${k}:${newIdx}`]=archived.notes[k];
  });
  state.archived.splice(ai,1);
  save();render();
  showToast(`♻️ ${archived.name} restore ho gayi!`,'success');
}

function permDeleteArchived(ai){
  if(!confirm(`"${state.archived[ai].name}" ko permanently delete karein? Ye action undo nahi ho sakta.`))return;
  state.archived.splice(ai,1);

// ── SVG ──
function polarToXY(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};}
function arcPath(cx,cy,r1,r2,s,e){
  const p1=polarToXY(cx,cy,r1,s),p2=polarToXY(cx,cy,r1,e);
  const p3=polarToXY(cx,cy,r2,e),p4=polarToXY(cx,cy,r2,s);
  const lg=(e-s)>180?1:0;
  return`M${p1.x},${p1.y} A${r1},${r1} 0 ${lg} 1 ${p2.x},${p2.y} L${p3.x},${p3.y} A${r2},${r2} 0 ${lg} 0 ${p4.x},${p4.y} Z`;
}
function ringWidth(){return Math.floor((245-62-(state.habits.length-1)*2)/state.habits.length);}

// ── STREAK ──
function getStreak(hi){
  const now=new Date();now.setHours(0,0,0,0);
  let streak=0,check=new Date(now);
  for(let i=0;i<365;i++){
    const y=check.getFullYear(),m=check.getMonth()+1,d=check.getDate();
    if(state.data[cellKey(d,hi,y,m)]){streak++;check.setDate(check.getDate()-1);}
    else break;
  }
  return streak;
}
function getStreakAt(day,hi,y,m){
  let streak=0,check=new Date(y,m-1,day);
  for(let i=0;i<365;i++){
    const cy=check.getFullYear(),cm=check.getMonth()+1,cd=check.getDate();
    if(state.data[cellKey(cd,hi,cy,cm)]){streak++;check.setDate(check.getDate()-1);}
    else break;
  }
  return streak;
}

  if(emojiPickerIndex===null)return;
  state.emojis[emojiPickerIndex]=e;
  document.getElementById('emojiPicker').classList.remove('open');
  emojiPickerIndex=null;
  save();render();
}

document.addEventListener('click',function(e){
  if(!e.target.closest('#emojiPicker')&&!e.target.closest('.emoji-btn')){
    document.getElementById('emojiPicker').classList.remove('open');
    emojiPickerIndex=null;
  }
});

// ── RENDER ──
function renderHabits(){
  const now=new Date();
  const todayD=now.getDate(),todayM=now.getMonth()+1,todayY=now.getFullYear();
  const isCurrentMonth=state.year===todayY&&state.month===todayM;

  document.getElementById('habitsRow').innerHTML=state.habits.map((h,i)=>{
    const em=state.emojis[i]||'⭐';
    const color=ALL_COLORS[i];
    const lightColor=ALL_LIGHT[i];
    // Check if today is done
    const todayKey=cellKey(todayD,i,todayY,todayM);
    const todayDone=!!state.data[todayKey];

    // Background fill when done
    const rowBg=todayDone?`background:${lightColor};border-radius:10px;`:'';
    const inputBg=todayDone?`background:${lightColor};border-color:${color};font-weight:500;color:#333`:'';

    // Toggle button
    const toggleBtn=`<button class="today-toggle${todayDone?' done':''}"
      style="background:${todayDone?color:'#f0f0f0'}"
      onclick="quickToggleToday(${i})"
      title="${todayDone?'Done aaj — click to undo':'Aaj done karo'}">
      ${todayDone?'✓':'○'}
    </button>`;

    return`<div class="habit-row" style="${rowBg}">
      <button class="emoji-btn" onclick="openEmojiPicker(${i},this)" title="Change emoji">${em}</button>
      <input class="habit-input" style="${inputBg}" value="${h.replace(/"/g,'&quot;')}" placeholder="Habit ${i+1}" oninput="updateHabit(${i},this.value)"/>
      ${toggleBtn}
      ${state.habits.length>1?`<button class="del-habit-btn" onclick="deleteHabit(${i})" title="Delete">🗑</button>`:''}
    </div>`;
  }).join('');
  const addRow=document.getElementById('addRow'),maxNote=document.getElementById('maxNote');
  if(state.habits.length>=MAX_HABITS){addRow.style.display='none';maxNote.textContent='Max 8 habits reached';}
  else{addRow.style.display='flex';maxNote.textContent='';}
}

function renderLegend(){
  document.getElementById('legend').innerHTML=
    state.habits.map((h,i)=>{
      const streak=getStreak(i);
      const em=state.emojis[i]||'⭐';
      const streakBadge=streak>=7?` <span style="color:#FFB300;font-weight:600">🔥${streak}</span>`:
                        streak>=3?` <span style="color:#FF6B35;font-weight:600">🔥${streak}</span>`:'';
      return`<div class="legend-item" onclick="openLogsModal(${i})" title="Logs dekhne ke liye tap karo">
        <span style="font-size:13px">${em}</span>
        <span>${h||'Habit '+(i+1)}${streakBadge}</span>
      </div>`;
    }).join('')+
    '<div class="legend-hint">👆 Habit tap karo — logs dekhne ke liye</div>';
}

function renderWheel(){
  const days=getDays(),cx=280,cy=280,innerR=62,ringGap=2,ringW=ringWidth(),apd=360/days;
  let html='';
  const now=new Date();
  const isCurrentMonth=state.year===now.getFullYear()&&state.month===(now.getMonth()+1);
  const isPastMonth=(new Date(state.year,state.month-1,1))<new Date(now.getFullYear(),now.getMonth(),1);
  document.getElementById('monthDisplay').textContent=MONTH_NAMES[state.month-1];

  for(let hi=0;hi<state.habits.length;hi++){
    const r1=innerR+(hi*(ringW+ringGap)),r2=r1+ringW;
    for(let d=1;d<=days;d++){
      const sA=(d-1)*apd+0.6,eA=d*apd-0.6;
      const done=!!state.data[cellKey(d,hi)];
      const hasNote=!!state.notes[noteKey(d,hi)];
      const future=isFuture(d)&&!isPastMonth,today=isToday(d);
      let fill,opacity=1,cursor='pointer';
      if(done)fill=ALL_COLORS[hi];
      else if(future){fill='#EFEFEF';opacity=0.4;cursor='not-allowed';}
      else fill=ALL_LIGHT[hi];
      const path=arcPath(cx,cy,r1,r2,sA,eA);
      const onclick=future?'':` onclick="toggleCell(${d},${hi})"`;
      html+=`<path d="${path}" fill="${fill}" stroke="${done&&getStreakAt(d,hi,state.year,state.month)>=7?'#FFD700':today?'#FF3B30':'#fff'}" stroke-width="${done&&getStreakAt(d,hi,state.year,state.month)>=7?3:today?2.5:1}" opacity="${opacity}" style="cursor:${cursor}"${onclick}><title>${MONTH_NAMES[state.month-1]} ${d} — ${state.habits[hi]} — ${done?'✅ Done':'⬜ Not done'}${done&&getStreakAt(d,hi,state.year,state.month)>=3?' 🔥'+getStreakAt(d,hi,state.year,state.month)+' day streak':''}${hasNote?' 📝':''}</title></path>`;

      // Emoji on cell — size based on ring width
      const em=state.emojis[hi]||state.habits[hi]?.[0]?.toUpperCase()||'●';
      const midA=(sA+eA)/2,midR=(r1+r2)/2,mp=polarToXY(cx,cy,midR,midA);
      const emSize=Math.max(6,Math.min(ringW*0.7,14));
      if(done){
        const streakAt=getStreakAt(d,hi,state.year,state.month);
        if(streakAt>=7){
          html+=`<text x="${mp.x}" y="${mp.y}" text-anchor="middle" dominant-baseline="middle" font-size="${emSize}" style="pointer-events:none">⭐</text>`;
        } else if(streakAt>=3){
          html+=`<text x="${mp.x}" y="${mp.y}" text-anchor="middle" dominant-baseline="middle" font-size="${emSize}" style="pointer-events:none">🔥</text>`;
        } else {
          html+=`<text x="${mp.x}" y="${mp.y}" text-anchor="middle" dominant-baseline="middle" font-size="${emSize}" opacity="0.95" style="pointer-events:none">${em}</text>`;
        }
      } else if(!future){
        html+=`<text x="${mp.x}" y="${mp.y}" text-anchor="middle" dominant-baseline="middle" font-size="${emSize}" opacity="0.22" style="pointer-events:none">${em}</text>`;
      }
    }
  }
  const labelR=innerR+(state.habits.length*(ringW+ringGap))+15;
  for(let d=1;d<=days;d++){
    const angle=(d-0.5)*apd,pos=polarToXY(cx,cy,labelR,angle),today=isToday(d),future=isFuture(d)&&!isPastMonth;
    html+=`<text x="${pos.x}" y="${pos.y}" text-anchor="middle" dominant-baseline="middle" font-size="${today?13:10}" font-weight="${today?'500':'400'}" fill="${today?'#FF3B30':future?'#ccc':'#888'}">${d}</text>`;
  }
  html+=`<text x="${cx}" y="${cy-18}" text-anchor="middle" font-size="13" font-weight="500" fill="#FF3B30">${MONTH_NAMES[state.month-1]}</text>`;
  html+=`<text x="${cx}" y="${cy}" text-anchor="middle" font-size="11" fill="#bbb">${days} days</text>`;
  html+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#ccc">tap to log</text>`;
  document.getElementById('wheel').innerHTML=html;
  const infoNote=document.getElementById('infoNote');
  if(isPastMonth)infoNote.textContent='Past month — you can still edit entries';
  else if(isCurrentMonth)infoNote.textContent='Tap any day to mark done + add a note 📝';
  else infoNote.textContent='Future month — dates will unlock when the time comes';
}

function renderStats(){
  const days=getDays();
  const isPastMonth=(new Date(state.year,state.month-1,1))<new Date(new Date().getFullYear(),new Date().getMonth(),1);
  const countableDays=isPastMonth?days:Array.from({length:days},(_,i)=>i+1).filter(d=>!isFuture(d)).length;
  const cols=state.habits.length<=4?state.habits.length:Math.ceil(state.habits.length/2);
  document.getElementById('statsRow').style.gridTemplateColumns=`repeat(${cols},1fr)`;
  document.getElementById('statsRow').innerHTML=state.habits.map((h,i)=>{
    const done=Array.from({length:days},(_,d)=>d+1).filter(d=>state.data[cellKey(d,i)]).length;
    const pct=countableDays?Math.round(done/countableDays*100):0;
    return`<div class="stat-card" onclick="openLogsModal(${i})" title="Logs dekhne ke liye tap karo"><div class="stat-pct" style="color:${ALL_COLORS[i]}">${pct}%</div><div class="stat-name">${h||'Habit '+(i+1)}</div></div>`;
  }).join('');
}

function render(){renderHabits();renderLegend();renderWheel();renderStats();renderArchived();}
document.getElementById('addHabitBtn').onclick=addHabit;
document.getElementById('newHabitInput').onkeydown=e=>{if(e.key==='Enter')addHabit();};
init();
</script>
</body>
